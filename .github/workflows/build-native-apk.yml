name: Build NOBAR Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/build-native-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source contracts and JavaScript rules
        working-directory: native-android
        run: |
          python3 scripts/verify-source.py
          bash scripts/test-js.sh
      - name: Build and run Android unit tests
        working-directory: native-android
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nobar-native-debug-apk
          path: |
            native-android/app/build/outputs/apk/debug/app-debug.apk
            native-android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 14
